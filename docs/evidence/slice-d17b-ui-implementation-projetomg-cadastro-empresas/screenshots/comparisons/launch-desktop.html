<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D.17B — comparação do formulário</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#eef1f4;color:#172033;font:600 13px/1.4 "Segoe UI",sans-serif}h1{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.panel{overflow:hidden;border:1px solid #dde2e8;border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(15,23,42,.06)}.panel header{padding:10px 12px;border-bottom:1px solid #e8ebef}.panel img{display:block;width:100%;height:auto}.reference header{background:#40de63}.after{outline:2px solid rgba(64,222,99,.6)}.note{margin-top:12px;color:#657084;font-weight:400}
  </style>
</head>
<body>
  <h1>D.17B — Estado de registro / lançamento (1440 × 900)</h1>
  <div class="grid">
    <section class="panel reference"><header>Referência — Registro</header><img src="../reference/reference-registro-read-1440x900.png" alt="Registro da referência" /></section>
    <section class="panel"><header>Pesagens — antes</header><img src="../pesagens-before/lancamento-1440x900.png" alt="Lançamento antes" /></section>
    <section class="panel after"><header>Pesagens — depois</header><img src="../pesagens-after/lancamento-1440x900.png" alt="Lançamento depois" /></section>
  </div>
  <p class="note">A comparação usa o estado de registro disponível na referência; os campos e ações continuam pertencendo ao domínio de pesagens.</p>
