name: Testes

# Roda lint, build e a bateria rápida de verificações (test:quick) em todo PR
# e em todo push na main, para nenhuma versão sair com verificação quebrada.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build da interface
        run: npm run build

      - name: Verificações (test:quick)
        run: xvfb-run -a npm run test:quick
