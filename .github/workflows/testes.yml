name: Testes

# Roda lint, build, a bateria rápida de verificações (test:quick) e o E2E do app em todo PR
# e em todo push na main, para nenhuma versão sair com verificação quebrada.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build da interface
        run: npm run build

      - name: Verificações (test:quick)
        run: xvfb-run -a npm run test:quick

      # App desktop de verdade (Electron + Playwright): primeiro acesso, cadastro,
      # lançamento, repesagem, Relação e reabertura com os dados.
      - name: E2E do app (Electron)
        run: xvfb-run -a npm run e2e:electron:verify

      # Integração do Lançamento com Entradas/Saídas e Sanidade: Compra, Venda, Doação sem peso, Entrada sem peso,
      # medicamento e posologia no próprio painel, dose sugerida × aplicada e layout 1440/768/390 (dados sintéticos).
      - name: E2E da integração do Lançamento (Electron)
        run: xvfb-run -a npm run e2e:launch-integration:verify

      # Lançamento: sair da tela e voltar mantém motivo da Entrada, sequência de brincos e pesagem automática;
      # bip de peso estável (1 toque por animal, nunca com balança vazia) com a balança simulada.
      - name: E2E da sessão do Lançamento e bip de estável (Electron)
        run: xvfb-run -a npm run e2e:launch-session:verify
